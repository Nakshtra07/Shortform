[package]
name = "autoshorts"
version = "0.1.3"
description = "Local-first long-form to short-form clip studio"
authors = ["AutoShorts"]
edition = "2021"
default-run = "autoshorts"

[lib]
name = "autoshorts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autoshorts"
path = "src/main.rs"

[[bin]]
name = "pacing_inspect"
path = "src/bin/pacing_inspect.rs"

[[bin]]
name = "boundary_inspect"
path = "src/bin/boundary_inspect.rs"

[[bin]]
name = "audio_inspect"
path = "src/bin/audio_inspect.rs"

[[bin]]
name = "caption_qa"
path = "src/bin/caption_qa.rs"

[[bin]]
name = "adaptive_t7_render"
path = "src/bin/adaptive_t7_render.rs"

[[bin]]
name = "closepair_render"
path = "src/bin/closepair_render.rs"

[build-dependencies]
tauri-build = { version = "2.0.6", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
dotenvy = "0.15"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.2.5", features = [] }
tauri-plugin-dialog = "2.2.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.12", features = ["v4", "serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
